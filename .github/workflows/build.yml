name: PSP build and simulation tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[publish-only]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run native simulation tests
        run: bash scripts/build_native.sh
      - name: Install pinned PSPDEV toolchain
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/pspdev.tar.gz" https://github.com/pspdev/pspdev/releases/download/v20261101/pspdev-ubuntu-latest-x86_64.tar.gz
          echo "5dc9d785a5fd490ee9d5204b90f715efb6c46940ba3944036bbef9c993c17713  $RUNNER_TEMP/pspdev.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$RUNNER_TEMP/pspdev.tar.gz" -C "$RUNNER_TEMP"
          echo "PSPDEV=$RUNNER_TEMP/pspdev" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pspdev/bin" >> "$GITHUB_PATH"
      - name: Compile PSP executable
        run: make -j2
      - name: Validate package
        run: python3 scripts/validate_pbp.py EBOOT.PBP
      - name: Verify tested release executable
        if: github.ref == 'refs/tags/v0.6.0' && hashFiles('evidence/v060-build-manifest.json') != ''
        run: |
          python3 scripts/verify_release_v060.py
          python3 tests/test_release_v060.py
      - uses: actions/upload-artifact@v4
        with:
          name: Dustbound-PSP
          path: EBOOT.PBP

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f evidence/v060-build-manifest.json
          cd dist
          sha256sum -c SHA256SUMS-0.6.0.txt
          cd ..
          if gh release view v0.6.0 >/dev/null 2>&1; then
            echo 'Release already exists; leaving its artifacts unchanged.'
          else
            gh release create v0.6.0 dist/Dustbound-0.6.0-* dist/SHA256SUMS-0.6.0.txt --target "$GITHUB_SHA" --title 'Dustbound 0.6.0 — Copper Road rebuild' --notes-file docs/RELEASE_NOTES.md --prerelease
          fi

  publish_only:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-only]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate living world and core regressions
        run: |
          bash scripts/validate_v080.sh
          bash scripts/validate_v081.sh
          bash scripts/validate_v090.sh
      - name: Install pinned PSPDEV toolchain
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/pspdev.tar.gz" https://github.com/pspdev/pspdev/releases/download/v20261101/pspdev-ubuntu-latest-x86_64.tar.gz
          echo "5dc9d785a5fd490ee9d5204b90f715efb6c46940ba3944036bbef9c993c17713  $RUNNER_TEMP/pspdev.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$RUNNER_TEMP/pspdev.tar.gz" -C "$RUNNER_TEMP"
          echo "PSPDEV=$RUNNER_TEMP/pspdev" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pspdev/bin" >> "$GITHUB_PATH"
      - name: Compile current PSP release
        run: |
          make -j2
          python3 scripts/validate_pbp.py EBOOT.PBP
          python3 -c 'import hashlib,json,pathlib; m=json.loads(pathlib.Path("evidence/v090-build-manifest.json").read_text()); assert hashlib.sha256(pathlib.Path("EBOOT.PBP").read_bytes()).hexdigest()==m["eboot_sha256"], "EBOOT differs from emulated build"'
      - name: Package PSP installer
        run: |
          mkdir -p release/PSP/GAME/DUSTBOUND
          cp EBOOT.PBP release/PSP/GAME/DUSTBOUND/EBOOT.PBP
          cp LICENSE release/LICENSE
          cp docs/RELEASE_NOTES.md release/README.md
          cd release
          zip -r ../Dustbound-0.9.0-PSP.zip PSP LICENSE README.md
          cd ..
          zip -r Dustbound-0.9.0-Screenshots.zip evidence/v090-psp-*.png evidence/v090-review-*.png evidence/v090-controller-checks.json evidence/v090-build-manifest.json docs/FEEDBACK_V090.md
          sha256sum EBOOT.PBP Dustbound-0.9.0-PSP.zip Dustbound-0.9.0-Screenshots.zip > SHA256SUMS-0.9.0.txt
      - name: Publish EBOOT and PSP installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.0 EBOOT.PBP Dustbound-0.9.0-PSP.zip Dustbound-0.9.0-Screenshots.zip SHA256SUMS-0.9.0.txt --target "$GITHUB_SHA" --title 'Dustbound 0.9.0 — Trade, disguises and earned experience' --notes-file docs/RELEASE_NOTES.md --prerelease
